name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm build

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go build check
        working-directory: codeagent-wrapper
        run: go build -o /dev/null .

      - name: Go test
        working-directory: codeagent-wrapper
        run: go test -short ./...

  coding-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: 2Red1Blue/personal-runtime
          ref: e7756e05e1b5d56b27a918046571b22b2666694f
          path: .qualification/personal-runtime

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Personal Runtime exact pin
        run: pnpm --dir .qualification/personal-runtime install --frozen-lockfile

      - name: Test Coding Domain contracts
        run: pnpm run test:coding-domain

      - name: Test review supervisor admission integration
        run: pnpm run test:review-supervisor

      - name: Qualify public Personal Runtime admission
        run: pnpm run qualify:personal-runtime -- --personal-runtime .qualification/personal-runtime
